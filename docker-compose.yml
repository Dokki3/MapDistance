services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    volumes:
      - ./data/valhalla:/custom_files
    environment:
      tile_urls: https://download.bbbike.org/osm/bbbike/Moscow/Moscow.osm.pbf
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      build_admins: "False"
      build_time_zones: "False"
      build_elevation: "False"
      build_transit: "False"
      use_default_speeds_config: "True"
      server_threads: "4"
      serve_tiles: "True"
    ports:
      - "8002:8002"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/status', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      VALHALLA_URL: http://valhalla:8002
    depends_on:
      valhalla:
        condition: service_healthy
    restart: unless-stopped
